name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag to release, e.g. v0.2.2'
        required: true
        type: string
      publish_release:
        description: 'Publish the GitHub release after signing (disable for a test artifact only)'
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: quietqqliu-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fengwenhua/quietqqliu' && github.actor == 'fengwenhua'
    environment: release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK 37
        run: bash scripts/setup-android.sh

      - name: Read version
        id: version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          values = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines()
                        if '=' in line and not line.startswith('#'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('name=%s\n' % values['versionName'].strip())
              out.write('code=%s\n' % values['versionCode'].strip())
          PY

      - name: Verify tag matches version.properties
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "tag $RELEASE_TAG does not match v$VERSION" >&2
            exit 1
          fi
          test -f "release-notes/release-notes-$VERSION.md" || {
            echo "missing release-notes/release-notes-$VERSION.md" >&2
            exit 1
          }

      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quietqqliu-release.jks"
          chmod 600 "$RUNNER_TEMP/quietqqliu-release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/quietqqliu-release.jks"
            echo "KEYSTORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify signature, package and version
        run: |
          build_tools=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 scripts/check-signing.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --build-tools "$build_tools"

      - name: Collect release assets
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          apk="app/build/outputs/apk/release/app-release.apk"
          cp "$apk" "dist/quietqqliu-$VERSION.apk"
          (cd dist && sha256sum "quietqqliu-$VERSION.apk" > "quietqqliu-$VERSION.apk.sha256")
          cp dist/"quietqqliu-$VERSION.apk.sha256" dist/SHA256SUMS
          ls -la dist

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: quietqqliu-signed
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "release-notes/release-notes-$VERSION.md"

      - name: Sync to Xposed-Modules-Repo (when a scoped token is configured)
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'MODULE_REPO_TOKEN not configured; skipping module repository sync.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          module_tag="$VERSION_CODE-$VERSION"
          gh release create "$module_tag" \
            dist/"quietqqliu-$VERSION.apk" \
            dist/"quietqqliu-$VERSION.apk.sha256" \
            --repo Xposed-Modules-Repo/io.github.fengwenhua.quietqqliu \
            --title "$VERSION" \
            --notes-file "release-notes/release-notes-$VERSION.md"
