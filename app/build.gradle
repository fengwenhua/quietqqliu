plugins {
    id 'com.android.application'
}

// 签名配置优先从 keystore.properties 读（本地，gitignored）；
// CI 使用 Actions Secrets 解码出的临时 keystore + KEYSTORE_FILE/KEYSTORE_PASSWORD/
// KEY_ALIAS/KEY_PASSWORD 环境变量。两者都没有时 release 任务硬失败，禁止回退 debug 签名。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// 版本号集中放在 version.properties，CI 和本地共用；可用 -PquietqqliuVersionName/-PquietqqliuVersionCode 覆盖。
def versionProps = new Properties()
rootProject.file("version.properties").withInputStream { versionProps.load(it) }
def quietqqliuVersionName = (findProperty("quietqqliuVersionName") ?: versionProps.getProperty("versionName")).toString()
def quietqqliuVersionCode = (findProperty("quietqqliuVersionCode") ?: versionProps.getProperty("versionCode")).toInteger()

// 本地从 keystore.properties 读；CI 用 Actions Secrets 解码出的临时 keystore + 环境变量。
def keystoreFile = keystoreProps.getProperty("storeFile") ?: System.getenv("KEYSTORE_FILE")
def keystorePassword = keystoreProps.getProperty("storePassword") ?: System.getenv("KEYSTORE_PASSWORD")
def keystoreAlias = keystoreProps.getProperty("keyAlias") ?: System.getenv("KEY_ALIAS")
def keystoreKeyPassword = keystoreProps.getProperty("keyPassword") ?: System.getenv("KEY_PASSWORD")
def hasKeystore = keystoreFile && keystorePassword && keystoreAlias && keystoreKeyPassword \
        && rootProject.file(keystoreFile).exists()

android {
    namespace 'com.quietqqliu.app'
    // The installed package is "platforms;android-37.2" (dir android-37.2), which AGP
    // cannot resolve from the bare compileSdk 37 name. Renaming the install dir to
    // android-37 is what satisfies AGP; documented in README.
    compileSdk 37

    defaultConfig {
        // 仓库新规：新模块包名必须是自有域名或 io.github.[用户名].[模块名]。
        // 这里用后者（自动审批）。Java 包名保持 com.quietqqliu.app 不变。
        applicationId "io.github.fengwenhua.quietqqliu"
        minSdk 29
        targetSdk 36
        versionCode quietqqliuVersionCode
        versionName quietqqliuVersionName
    }

    testOptions {
        // HookState/Report 等纯 JVM 测试会经过 android.util.Log；
        // 让未 mock 的 Android 方法返回默认值，便于纯 JVM 单测。
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreFile)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
                // minSdk 29 不需要 v1；v2 + v3 同时开启，check-signing.py 会分别验证。
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // hook 集已稳定，开启 R8 收缩（Material 依赖会让 APK 涨到 10MB 级）。
            // 入口类与回调的 keep 规则见 proguard-rules.pro。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI 等无 keystore 环境：signingConfigs.release 不存在，这里条件引用，
            // 避免配置阶段就报 "Could not get unknown property 'release'"。
            // 真正的兜底在文件底部的 taskGraph.whenReady：无 keystore 时 release
            // 任务图仍然硬失败，不会静默产出 debug 签名或未签名包。
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Provided by the framework inside the hooked process; must never be packaged.
    compileOnly 'io.github.libxposed:api:102.0.0'

    // compileOnly 不拉传递依赖；@NonNull 来自下面的 appcompat/material 传递依赖，
    // 不再单独声明 androidx.annotation，避免与它们的版本约束冲突。

    // service must be PACKAGED, not compileOnly: the manifest declares
    // io.github.libxposed.service.XposedProvider, and it is instantiated inside the
    // module app's own process (compileOnly classes are absent at runtime).
    // XposedProvider only forwards a binder and touches no hooked-process API.
    implementation 'io.github.libxposed:service:102.0.0'

    // UI 只在模块 App 进程用；hook 代码绝不引用这些类，所以不会影响宿主进程。
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // Config 的公开方法签名引用 XposedModule；主源码 compileOnly 在单测运行期不可见，
    // 这里补同一坐标（不新增新库）。
    testImplementation 'io.github.libxposed:api:102.0.0'
}

// ---------------------------------------------------------------- 签名门禁

// release 必须使用正式签名：keystore.properties 缺失 / storeFile 未配置时，
// 只要本次任务图里出现 release 变体任务就在执行前失败，避免静默产出 debug 签名版本。
// 用 taskGraph.whenReady 覆盖 assemble/package/install/bundle 全部入口；debug 不受影响。
def releaseTaskNames = ["assembleRelease", "packageRelease", "installRelease", "bundleRelease"]
gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore && graph.allTasks.any { it.project == project && releaseTaskNames.contains(it.name) }) {
        throw new GradleException("缺少有效 keystore.properties（storeFile 未配置）：release 构建必须使用正式签名")
    }
}

// 本机离线缓存里 material/preference 的传递依赖 recyclerview 1.1.0 缺失；
// 统一提升到 1.4.0（向后兼容），有网环境同样适用。
configurations.all {
    resolutionStrategy {
        force 'androidx.recyclerview:recyclerview:1.4.0'
    }
}
